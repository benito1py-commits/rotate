<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6ec7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ff6ec7"/>
      <stop offset="100%" stop-color="#aa44ff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1a1a2e"/>
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>
  <!-- Stylized hand/gesture -->
  <g transform="translate(16, 12)" stroke="url(#hand)" stroke-width="2.5" stroke-linecap="round" fill="none">
    <!-- Palm -->
    <path d="M16,30 Q8,28 6,22 L6,16 Q6,14 8,14 L8,18 Q8,12 10,8 Q10,6 12,6 L12,18 Q12,8 14,4 Q14,2 16,2 L16,18 Q16,8 18,4 Q18,2 20,2 L20,14 Q22,10 24,10 Q26,10 26,12 L26,22 Q26,28 20,30 Z"/>
    <!-- Tracking dots -->
    <circle cx="12" cy="6" r="1.5" fill="#00f0ff" stroke="none">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="16" cy="2" r="1.5" fill="#ff6ec7" stroke="none">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="2" r="1.5" fill="#aa44ff" stroke="none">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
